<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c2654"/>
      <stop offset="0.55" stop-color="#121834"/>
      <stop offset="1" stop-color="#0b0d16"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.45" cy="0.42" r="0.5">
      <stop offset="0" stop-color="#f5c451" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#f5c451" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff1b8"/>
      <stop offset="0.35" stop-color="#f3c652"/>
      <stop offset="0.7" stop-color="#c98d2a"/>
      <stop offset="1" stop-color="#8a5a17"/>
    </linearGradient>
    <linearGradient id="goldEdge" x1="1" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#6b430f"/>
      <stop offset="1" stop-color="#ffe7a0"/>
    </linearGradient>
    <radialGradient id="glass" cx="0.4" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#2d3f86"/>
      <stop offset="0.6" stop-color="#16204a"/>
      <stop offset="1" stop-color="#0b1026"/>
    </radialGradient>
    <linearGradient id="handle" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7a4a22"/>
      <stop offset="1" stop-color="#3d220d"/>
    </linearGradient>
    <linearGradient id="star" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff6d0"/>
      <stop offset="0.5" stop-color="#ffd668"/>
      <stop offset="1" stop-color="#d99a2b"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <!-- tile -->
  <rect x="32" y="32" width="960" height="960" rx="216" fill="url(#bg)"/>
  <rect x="32" y="32" width="960" height="960" rx="216" fill="url(#glow)"/>
  <rect x="44" y="44" width="936" height="936" rx="204" fill="none" stroke="#f3c652" stroke-opacity="0.22" stroke-width="6"/>

  <!-- handle (behind the ring) -->
  <g transform="rotate(-45 456 440)">
    <rect x="404" y="700" width="104" height="250" rx="40" fill="url(#gold)"/>
    <rect x="420" y="742" width="72" height="184" rx="26" fill="url(#handle)"/>
    <rect x="420" y="772" width="72" height="12" fill="#c98d2a" opacity="0.7"/>
    <rect x="420" y="822" width="72" height="12" fill="#c98d2a" opacity="0.7"/>
    <rect x="420" y="872" width="72" height="12" fill="#c98d2a" opacity="0.7"/>
  </g>

  <!-- ring shadow -->
  <circle cx="456" cy="452" r="268" fill="#000" opacity="0.35" filter="url(#soft)"/>
  <!-- glass -->
  <circle cx="456" cy="440" r="244" fill="url(#glass)"/>
  <!-- star -->
  <g transform="translate(456 440)">
    <path d="M0,-170 L34,-48 L156,-60 L56,14 L104,140 L0,62 L-104,140 L-56,14 L-156,-60 L-34,-48 Z"
          fill="url(#star)" stroke="#8a5a17" stroke-width="6" stroke-linejoin="round"/>
    <path d="M0,-170 L34,-48 L0,0 Z M0,0 L156,-60 L56,14 Z M0,0 L104,140 L0,62 Z M0,0 L-104,140 L-56,14 Z M0,0 L-156,-60 L-34,-48 Z"
          fill="#ffffff" opacity="0.18"/>
    <circle r="22" fill="#fff6d0" opacity="0.9"/>
  </g>
  <!-- glass highlight -->
  <path d="M290,360 A190,190 0 0 1 430,236" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="22" stroke-linecap="round"/>
  <!-- ring -->
  <circle cx="456" cy="440" r="262" fill="none" stroke="url(#gold)" stroke-width="60"/>
  <circle cx="456" cy="440" r="292" fill="none" stroke="url(#goldEdge)" stroke-width="6" opacity="0.8"/>
  <circle cx="456" cy="440" r="232" fill="none" stroke="#6b430f" stroke-width="6" opacity="0.9"/>
  <!-- sparkles -->
  <path d="M790,214 l10,30 30,10 -30,10 -10,30 -10,-30 -30,-10 30,-10 Z" fill="#ffe7a0" opacity="0.9"/>
  <path d="M206,770 l7,20 20,7 -20,7 -7,20 -7,-20 -20,-7 20,-7 Z" fill="#ffe7a0" opacity="0.6"/>
</svg>
